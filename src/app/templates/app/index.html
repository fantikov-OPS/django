<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комментарий</title>
</head>
<body>
    <h1>Форма</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>

    {% if stats %}
        <p>Длина комментария: {{ stats.length }}</p>
        <p>Гласных: {{ stats.vowels }}</p>
        <p>Согласных: {{ stats.consonants }}</p>
    {% endif %}
</body>
</html>
